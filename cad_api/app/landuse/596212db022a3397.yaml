# Land use — JANADRIYAH DMP - 20240506.dxf
#
# Per-drawing override. It beats `_patterns.yaml`; whatever is not named here
# falls through to the global patterns, then to `unclassified`.
#
# HOW TO READ IT, and the one thing to hold on to while editing it:
#
#   `use` + `subtype` + `role`  = THE CLASSIFICATION. This is a human decision.
#   `sources`                   = HOW that classification is known.
#   `note`                      = a remark. NOT a source.
#
# There is no `verified:` and no free-text `source:` in this file, and adding
# either will be refused by the loader. Together they are a mechanism for
# raising the evidence grade in YAML form: `{use: open_space, verified: true,
# source: "layer name"}` is one source, one corpus, marked verified by hand.
# `verified` is now derived from the config layer (`drawing_override` true,
# `global_pattern` always false) and `grade` is computed from `sources`. D-082.
#
# `observed` is the string ACTUALLY read in the file, and that is what
# `evidence.speaks_for()` tests — not the prose in `detail`. Filling `observed`
# with the same sentence as `detail` makes the literal test meaningless. For
# Arabic SHX text, `observed` is its reading and `observed_raw` is the bytes as
# they are in the file.
version: 1
drawing_id: "596212db022a3397"
drawing_name: "JANADRIYAH DMP - 20240506"
default_use: unknown

# The drawing's coordinate system. NOT stated by the file — checked 23 August
# 2026: there is no GEODATA object, `$GEODATA` is absent from the header, and
# `modelspace.get_geodata()` returns None. So this whole block is inference,
# and it is `declared_in_file: false` that makes that travel with every
# response carrying a lat/long.
crs:
  epsg: 32638
  name: "WGS 84 / UTM zone 38N"
  declared_in_file: false
  sources:
    - origin: geometry
      locator: "modelspace extents"
      detail: >-
        the extents (687,513.9 / 2,747,693.5) - (703,120.6 / 2,757,082.8) are
        UTM-shaped. Inverted as zone 38N they land at 24.831-24.917 N /
        46.856-47.011 E, which is Janadriyah north-east of Riyadh; inverted as
        zone 37N they land at 40.86 E, in the Red Sea
    - origin: absence
      locator: "the $GEODATA header and modelspace.get_geodata()"
      detail: >-
        the file does not state its coordinate system at all; there is no
        GEODATA object, so the zone above is a conclusion drawn from where it
        sits, not a statement by the file
  unknown: "the UTM zone, the datum, and the projection are not stated in any file"
  how_to_verify: "confirm with the drawing's author; it is on the same list as the typology key and the SHX font files, which are also still missing"
  note: >-
    Do not use it for anything binding before it is confirmed. A cross-check
    anyone can verify: the `Jumaa Mosque` parcel, handle 205D0EB, lands at
    24.85142 / 46.89358 and `Primary School`, handle 205D153, at
    24.85975 / 46.89974

# A fact used by more than one entry is written ONCE here, so that two copies
# of it cannot differ after one of them is edited. Keys prefixed with an
# underscore are skipped by the loader.
