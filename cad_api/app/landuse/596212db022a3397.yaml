    use: road
    sources:
      - {origin: layer_name, observed: "Living Plaza-Road",
         locator: "Living Plaza-Road", detail: "layer name"}
    note: "declared in the layer table and contains ZERO entities"

  # --- road pavement, not parcels ------------------------------------------
  #
  # Both are here because the global patterns read them wrongly: 'PARKING'
  # inside the name of a road-marking layer is not a parking land use. A wrong
  # classification is worse than no classification, so both are locked with the
  # right role instead of being left to the patterns.
  "- ROADS-PARKING-MARKINGS":
    use: road
    subtype: road_markings
    role: overlay
    sources:
      - {origin: layer_name, observed: "- ROADS-PARKING-MARKINGS",
         locator: "- ROADS-PARKING-MARKINGS", detail: "layer name"}
      - {origin: geometry, locator: "- ROADS-PARKING-MARKINGS",
         detail: "108 entities: 94 LINE and 14 open LWPOLYLINE; not one closed polygon"}
    note: "markings on the pavement, not parking bays. role=overlay so that it is never counted as a parcel"
  "00-Parking flush kerbs":
    use: parking
    subtype: kerb_line
    role: overlay
    sources:
      - {origin: layer_name, observed: "00-Parking flush kerbs",
         locator: "00-Parking flush kerbs", detail: "layer name"}
      - {origin: geometry, locator: "00-Parking flush kerbs",
         detail: "13 LINE; no closed polygon, so there is no bay to count"}
    note: "kerb lines, not parking bays"

# Layers that ARE in the layer table but contain nothing. A query here returns
# nil and reads as 'that land use is not in the drawing'.
#
# This list is a hand-written ADDITION, not the only source: the response also
# derives, on its own, every classified layer whose entity_count is zero, so
# that an empty layer first appearing in the next revision does not have to
# wait for someone to remember to add it here.
empty_but_declared:
  - "CS-Land use-00_Education"
  - "CS-Land use-00_Commercial"
  - "CS-Land use-00_Open Space"
  - "CS-Land use-00_Religious_Mosque"
  - "CS-Land use-00_Roads and Parking"
  - "CS-Land use-00_Utilities"
