    origin: topology
    locator: "BlockBoundary"
    detail: >-
      2,380 plots on 13 typology-code layers fill 197 BlockBoundary polygons;
      Σ plot area 712,977.389756 m2 against Σ BlockBoundary area
      712,977.351390 m2 — a difference of 0.038366 m2 over 197 polygons

  plot_module: &src_plot_module
    origin: geometry
    locator: "13 typology-coded layers, Model"
    detail: >-
      2,312 of the 2,380 plots have at least one side between 24 and 26 m; the
      same module depth repeats across all thirteen layers

  no_word_for_it: &src_no_word_for_it
    origin: absence
    locator: "the whole file"
    detail: >-
      zero of the 43,109 TEXT/MTEXT contain 'residential', 'villa', 'house', or
      any typology code; 18 non-residential land uses have an explicitly named
      layer, so the rest is concluded by elimination

  edu_label: &src_edu_label
    origin: entity_text
    observed: "مرفق تعليمي"
    observed_raw: "lvtR jugdlD"
    locator: "T4, Model"
    layout: "Model"
    detail: >-
      8 TEXT on layer T4 in Model read 'مرفق تعليمي' (educational facility).
      That count equals the 8 education parcels that have a SchoolHatch; the
      one-to-one link to a parcel has not been tested point-in-polygon
      (UPLIFT-03)
    reading:
      verbatim: false
      method: "shx-map:xarb.shx"
      corpus_verified: true

